name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk Dcam.apk

      - uses: actions/upload-artifact@v4
        with:
          name: dcam-apk
          path: Dcam.apk

      # Always-the-same download link:
      # https://github.com/divakardznsyk/Dcam/releases/download/latest/Dcam.apk
      - name: Publish rolling "latest" release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest Dcam.apk \
            --title "Dcam (latest build)" \
            --notes "Latest build from main, commit ${GITHUB_SHA::7}. Download Dcam.apk and install it." \
            --target "$GITHUB_SHA"
